[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/nttung245/open-prism"
publish = false

[workspace.dependencies]
openprism-core = { path = "crates/core" }
openprism-ai = { path = "crates/ai" }
openprism-literature = { path = "crates/literature" }

anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
flate2 = "1.1"
futures-util = "0.3"
genai = "0.7.5"
getrandom = "0.4"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
hex = "0.4"
hmac = "0.13"
insta = { version = "1.49", features = ["yaml"] }
mime_guess = "2"
nix = { version = "0.32", features = ["signal", "process", "fs"] }
notify = "8.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6"
tempfile = "3.27"
thiserror = "2"
time = "0.3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id", "util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
uuid = { version = "1.29", features = ["v7"] }
which = "8"
zip = { version = "9.7", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
